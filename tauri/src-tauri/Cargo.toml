[package]
name = "artemis-paysages-app"
version = "0.1.0"
edition = "2021"
description = "Artemis Paysages — Enregistreur de réunion et analyse ProcessCom"

[features]
parakeet = ["minutes-core/parakeet"]
coreml = ["minutes-core/coreml"]
cuda = ["minutes-core/cuda"]
hipblas = ["minutes-core/hipblas"]
metal = ["minutes-core/metal"]
vulkan = ["minutes-core/vulkan"]
# Artemis/Catalia: embed and auto-seed the Artemis default config.toml
# on first launch. Forwarded to minutes-core — see that crate's feature
# docs. Fresh upstream builds leave this off.
artemis-default-config = ["minutes-core/artemis-default-config"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
notify-rust = "4.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { workspace = true }
minutes-core = { path = "../../crates/core", features = ["streaming", "diarize"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
libc = "0.2"
which = { workspace = true }
portable-pty = "0.9"
base64 = "0.22"
futures-util = "0.3"
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tauri-plugin-pty = "0.1"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
walkdir = { workspace = true }
ureq = { workspace = true }
window-vibrancy = "0.7"
notify = "7"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
